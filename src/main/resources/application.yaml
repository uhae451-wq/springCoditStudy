## EditConfigurations > Active Profiles에 수정으로 사용할 yaml파일 지정 가능 ( ex. dev / prod )
spring:
  application:
    name: springCoditStudy
  datasource:
    url: jdbc:postgresql://localhost:5432/springcodeitstudy
    username : chichi
    password : vmflwma1!

  jpa:
    hibernate:
      ddl-auto: create
      ## create : 기존 테이블 모두 drop후 재생성
      ## create-drop : create 후 앱 종료시 drop
      ## update : 바뀐 부분만 alter (삭제는 안함)
      ## validate : 엔티티와 테이블이 맞는지 확인함
      ## none : 아무것도 안함
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.transaction.interceptor: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.hibernate.SQL: DEBUG
    ## 해당 프로젝트는 기본적으로 info까지 출력이 된다.
    root: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20}:%msg%n"
  file:
    name: logs/app.log

server:
  port: 8080

my:
  greeting: "Hello, Spring!"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics     # 이 세 개만 엽니다
  endpoint:
    health:
      show-details: always                 # 항목별 결과까지 보여줍니다
  info:
    env:
      enabled: true                        # 아래 info 값을 노출합니다
